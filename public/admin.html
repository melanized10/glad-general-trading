<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glad General Trading | Admin</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="admin-layout"><p><a href="/">← Return to Website</a></p><h1>Website Administration</h1><p class="notice">Manage company text, services, founders, staff, contractors, and portfolio. All updates save to the database.</p><p id="message" role="status"></p><section id="loginPanel" style="padding:0"><form id="login"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><p><button class="btn">Log In</button></p></form></section><section id="editor" hidden style="padding:0"><button class="btn alt" id="logout">Log out</button><h2>Company information</h2><div id="settings"></div><h2>Services, Team, Contractors & Portfolio</h2><label for="section">Choose Section</label><select id="section"><option value="services">Services</option><option value="founders">Co-founders (2)</option><option value="staff">Staff (8)</option><option value="contractors">Contractors & Clients</option><option value="portfolio">Portfolio</option></select><div id="items" class="admin-list"></div><h3>Add new item</h3><form id="addItem"><label>Title / Name<input name="title" required maxlength="180"></label><label>Subtitle / Position<input name="subtitle" maxlength="180"></label><label>Description<textarea name="description" rows="3" maxlength="2000"></textarea></label><button class="btn">Add Item</button></form></section></div><script type="module" src="/js/admin.js"></script></body></html>
